<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Household voice</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>Household assistant</h1>
    <nav>
      <a href="/">Chat</a>
      <a href="/voice" aria-current="page">Voice</a>
    </nav>
    <span id="info"></span>
  </header>
  <main>
    <div class="notice" id="notice" hidden></div>
    <div class="controls">
      <select id="voice" aria-label="Voice">
        <option value="">Default voice</option>
        <option value="marin">marin</option>
        <option value="cedar">cedar</option>
      </select>
      <button type="button" id="start">Start the call</button>
      <button type="button" class="secondary" id="stop" disabled>Hang up</button>
      <span class="status" id="status">Not connected</span>
    </div>
    <p class="hint">GPT-Live talks with you; questions about the household go to the assistant, which looks them up in
      the notes. Its tool calls show up below. Ask, for example: “When are we painting the kitchen?”</p>
    <div class="log" id="log" aria-live="polite"></div>
    <audio id="speaker" autoplay></audio>
  </main>
  <script src="/voice.js"></script>
</body>
</html>
