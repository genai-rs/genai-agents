openapi: 3.0.3
info:
  title: genai-agents demo
  description: >-
    The HTTP API of the demo's web pages: a chat with the household assistant, with approvals for the calls that
    need them, and a voice page that talks to GPT-Live while the assistant does the work it delegates. The server
    is generated from this file by openapi-generator-timvw-rust (`targets: [server]`); see `demo/scripts/generate-api.sh`.
  version: 0.1.0
  license:
    name: MIT OR Apache-2.0
servers:
  - url: /
tags:
  - name: assistant
    description: The household assistant, over text.
  - name: live
    description: GPT-Live, with the household assistant behind it.
paths:
  /api/info:
    get:
      tags: [assistant]
      operationId: getInfo
      summary: What the server runs on.
      responses:
        "200":
          description: The models and what is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
  /api/sessions/{session}:
    get:
      tags: [assistant]
      operationId: getSession
      summary: The conversation of a session, for a page that reloads.
      parameters:
        - $ref: "#/components/parameters/Session"
      responses:
        "200":
          description: The messages, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
        "default":
          $ref: "#/components/responses/Problem"
  /api/sessions/{session}/messages:
    post:
      tags: [assistant]
      operationId: sendMessage
      summary: Ask the assistant a question in a session.
      parameters:
        - $ref: "#/components/parameters/Session"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "200":
          description: The turn, answered or waiting for approvals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turn"
        "default":
          $ref: "#/components/responses/Problem"
  /api/sessions/{session}/approvals:
    post:
      tags: [assistant]
      operationId: decideApprovals
      summary: Approve or deny the calls a turn is waiting for, and go on.
      parameters:
        - $ref: "#/components/parameters/Session"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalsRequest"
      responses:
        "200":
          description: The turn, answered or waiting for more approvals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turn"
        "default":
          $ref: "#/components/responses/Problem"
  /api/live/sessions:
    post:
      tags: [live]
      operationId: createLiveSession
      summary: Start a GPT-Live session for the browser's WebRTC offer.
      description: >-
        The server creates the session with its own API key, which never reaches the browser, and returns the
        answer to the offer. Tasks GPT-Live delegates come to the application (client delegation); the page
        sends them to `/api/live/delegations`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveSessionRequest"
      responses:
        "201":
          description: The session and the answer to the offer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
        "default":
          $ref: "#/components/responses/Problem"
  /api/live/delegations:
    post:
      tags: [live]
      operationId: runDelegation
      summary: Run a task GPT-Live delegated, with the assistant.
      description: >-
        The task is what the caller said so far: GPT-Live's delegation event carries no task text. The answer is
        for `session.commentary.append`, which GPT-Live speaks in its own words.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegationRequest"
      responses:
        "200":
          description: The assistant's answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationResult"
        "default":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    Session:
      name: session
      in: path
      required: true
      description: The session's id, letters, digits, `-` and `_`.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,64}$"
  responses:
    Problem:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Info:
      type: object
      required: [model, tracing, live]
      properties:
        model:
          type: string
          description: The assistant's model, and its fallback.
          example: OpenAI gpt-5-mini, falling back to Ollama qwen2.5:3b
        tracing:
          type: boolean
          description: Whether runs are traced to Langfuse.
        live:
          type: boolean
          description: Whether the voice page can start GPT-Live (an OpenAI API key is set).
        live_model:
          type: string
          description: The GPT-Live model.
          example: gpt-live-1
    History:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
    Message:
      type: object
      required: [role, text]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        text:
          type: string
    Role:
      type: string
      enum: [user, assistant]
    MessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
    ApprovalsRequest:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ApprovalDecision"
    ApprovalDecision:
      type: object
      required: [call, approve]
      properties:
        call:
          $ref: "#/components/schemas/PendingCall"
        approve:
          type: boolean
          description: Run the call (true) or tell the assistant the user said no (false).
    PendingCall:
      type: object
      description: >-
        A call that waits for a person, as genai-agents serializes it. The page sends it back unchanged with its
        decision; the hash binds the decision to these arguments.
      required: [call_id, name, arguments, key, hash]
      properties:
        call_id:
          type: string
        name:
          type: string
        namespace:
          type: string
        arguments:
          type: string
          description: The arguments, as JSON text.
        key:
          type: string
        hash:
          type: string
    Turn:
      type: object
      required: [status, calls, requests, tokens]
      properties:
        status:
          type: string
          enum: [answered, approval, stopped]
          description: >-
            `answered`: `answer` holds the answer. `approval`: `pending` holds the calls to decide.
            `stopped`: the run stopped otherwise, `detail` says why.
        answer:
          type: string
        detail:
          type: string
        pending:
          type: array
          items:
            $ref: "#/components/schemas/PendingCall"
        calls:
          type: array
          description: The tools the assistant called in this turn, in order.
          items:
            $ref: "#/components/schemas/Call"
        requests:
          type: integer
          format: int32
          description: The model requests of the turn.
        tokens:
          type: integer
          format: int64
          description: Input and output tokens of the turn.
        trace_id:
          type: string
          description: The Langfuse trace of the turn, when tracing is on.
        trace_url:
          type: string
          description: The trace in the Langfuse UI, when its project is known.
    Call:
      type: object
      required: [name, arguments]
      properties:
        name:
          type: string
        arguments:
          type: string
    LiveSessionRequest:
      type: object
      required: [sdp]
      properties:
        sdp:
          type: string
          minLength: 1
          description: The browser's WebRTC offer.
        voice:
          type: string
          description: A built-in voice, such as `marin`.
    LiveSession:
      type: object
      required: [id, sdp]
      properties:
        id:
          type: string
          description: The Live session's id.
        sdp:
          type: string
          description: The answer to the offer.
    DelegationRequest:
      type: object
      required: [delegation_id, transcript]
      properties:
        delegation_id:
          type: string
        transcript:
          type: array
          description: What was said so far, oldest first.
          minItems: 1
          items:
            $ref: "#/components/schemas/Message"
    DelegationResult:
      type: object
      required: [answer, calls]
      properties:
        answer:
          type: string
          description: For `session.commentary.append` (500 tokens at most).
        calls:
          type: array
          items:
            $ref: "#/components/schemas/Call"
        trace_id:
          type: string
        trace_url:
          type: string
    Problem:
      type: object
      required: [message]
      properties:
        message:
          type: string
