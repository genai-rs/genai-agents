name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: genai-rs/.github/.github/workflows/rust-ci.yml@main
    with:
      msrv: "1.89"
      # WebAssembly: clippy for both crates, and the runner's tests (tests/wasm.rs) in Node.js.
      wasm-clippy-args: |
        -p genai-agents --lib --test wasm
        -p genai-agents-openai --no-default-features --lib
      wasm-test-args: |
        -p genai-agents --test wasm
    secrets: inherit
