[workspace]
resolver = "2"
members = [
    "crates/genai-agents",
    "crates/genai-agents-eval",
    "crates/genai-agents-macros",
    "crates/genai-agents-openai",
    "crates/genai-agents-sqlite",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"
authors = ["Tim Van Wassenhove <github@timvw.be>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/genai-rs/genai-agents"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"
