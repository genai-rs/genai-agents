[package]
name = "genai-agents"
version = "0.3.4"
description = "Agents for Rust: a tool loop, sessions, guardrails, handoffs and tracing, independent of the model provider"
documentation = "https://docs.rs/genai-agents"
readme = "README.md"
keywords = ["agents", "llm", "genai", "tools", "ai"]
categories = ["api-bindings", "asynchronous"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
## `tools::schema::for_type`: a tool's parameters schema derived from its input type.
schemars = ["dep:schemars"]
## `session::JsonlStore`: sessions in JSON Lines files (not on WebAssembly).
jsonl = []
## `testing::ScriptedModel`: a model that answers as a script says, for tests.
testing = []
## `#[tool]`: a function tool from an async function.
macros = ["schemars", "dep:genai-agents-macros"]

[dependencies]
futures = "0.3.34"
genai-agents-macros = { version = "0.1.1", path = "../genai-agents-macros", optional = true }
schemars = { version = "1.2.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
tracing = "0.1.44"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["sync", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
gloo-timers = { version = "0.4.1", features = ["futures"] }
web-time = "1.1.0"

[dev-dependencies]
# The crate itself with `testing`, for its own tests, and `macros`, for the tools guide.
genai-agents = { path = ".", features = ["testing", "macros"] }
schemars = "1.2.3"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }

# `tests/wasm.rs`, run in Node.js with wasm-bindgen-test-runner.
[target.'cfg(target_family = "wasm")'.dev-dependencies]
gloo-timers = { version = "0.4.1", features = ["futures"] }
wasm-bindgen-futures = "0.4.80"
wasm-bindgen-test = "0.3.80"
