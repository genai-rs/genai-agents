[package]
name = "genai-agents"
version = "0.2.0"
description = "Agents for Rust: a tool loop, sessions, guardrails, handoffs and tracing, independent of the model provider"
documentation = "https://docs.rs/genai-agents"
readme = "README.md"
keywords = ["agents", "llm", "genai", "tools", "ai"]
categories = ["api-bindings", "asynchronous"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
## `tools::schema::for_type`: a tool's parameters schema derived from its input type.
schemars = ["dep:schemars"]
## `session::JsonlStore`: sessions in JSON Lines files (not on WebAssembly).
jsonl = []
## `testing::ScriptedModel`: a model that answers as a script says, for tests.
testing = []

[dependencies]
futures = "0.3.31"
schemars = { version = "1.0.4", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.0", default-features = false, features = ["sync"] }
tracing = "0.1.41"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.45.0", default-features = false, features = ["sync", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
gloo-timers = { version = "0.3.0", features = ["futures"] }
web-time = "1.1.0"

[dev-dependencies]
# The crate itself with `testing`, for its own tests.
genai-agents = { path = ".", features = ["testing"] }
schemars = "1.0.4"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1.45.0", features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["registry"] }

# `tests/wasm.rs`, run in Node.js with wasm-bindgen-test-runner.
[target.'cfg(target_family = "wasm")'.dev-dependencies]
gloo-timers = { version = "0.3.0", features = ["futures"] }
wasm-bindgen-futures = "0.4.50"
wasm-bindgen-test = "0.3.50"
