[package]
name = "genai-agents-openai"
version = "0.3.1"
description = "The OpenAI provider for genai-agents, on openai-ergonomic"
documentation = "https://docs.rs/genai-agents-openai"
readme = "README.md"
keywords = ["agents", "llm", "openai", "tools", "ai"]
categories = ["api-bindings", "asynchronous"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rustls-tls"]
## TLS with rustls.
rustls-tls = ["openai-ergonomic/rustls-tls"]
## TLS with the platform's native library.
native-tls = ["openai-ergonomic/native-tls"]

[dependencies]
futures = "0.3.31"
genai-agents = { version = "0.3.1", path = "../genai-agents" }
openai-ergonomic = { version = "0.24.1", default-features = false }
serde_json = "1.0.140"
timvw-rust-runtime = { version = "0.4.1", default-features = false, features = ["time"] }

[dev-dependencies]
bytes = "1.10.1"
http = "1.3.1"
mockito = { version = "1.7.0", default-features = false }
# examples/langfuse.rs (opentelemetry-langfuse would build the exporter, but needs Rust 1.93.1)
base64 = "0.23.1"
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
opentelemetry_sdk = "0.33.1"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["registry"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5.2", features = ["util"] }
