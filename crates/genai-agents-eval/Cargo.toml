[package]
name = "genai-agents-eval"
version = "0.3.1"
description = "Evals for genai-agents: datasets, scorers, repeated runs, reports with a baseline, Langfuse dataset runs"
documentation = "https://docs.rs/genai-agents-eval"
readme = "README.md"
keywords = ["agents", "llm", "evals", "testing", "ai"]
categories = ["development-tools::testing", "asynchronous"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
## `langfuse`: run a Langfuse dataset as a dataset run, with the scores on its traces.
langfuse = ["dep:langfuse-ergonomic"]

[dependencies]
futures = "0.3.31"
genai-agents = { version = "0.3.4", path = "../genai-agents" }
langfuse-ergonomic = { version = "0.17.0", optional = true }
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1.0"

[dev-dependencies]
genai-agents = { version = "0.3.4", path = "../genai-agents", features = ["testing"] }
mockito = { version = "1.7.0", default-features = false }
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread", "time"] }
