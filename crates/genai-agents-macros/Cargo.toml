[package]
name = "genai-agents-macros"
version = "0.1.2"
description = "The #[tool] attribute of genai-agents: a tool from an async function"
documentation = "https://docs.rs/genai-agents-macros"
readme = "README.md"
keywords = ["agents", "llm", "tools", "macro", "ai"]
categories = ["development-tools::procedural-macro-helpers", "asynchronous"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["full"] }

[dev-dependencies]
# Without a version, so that publishing leaves it out: genai-agents depends on this crate.
genai-agents = { path = "../genai-agents", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
