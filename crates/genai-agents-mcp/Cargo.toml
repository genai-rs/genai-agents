[package]
name = "genai-agents-mcp"
version = "0.1.0"
description = "The tools of MCP servers as genai-agents tools, on rmcp"
documentation = "https://docs.rs/genai-agents-mcp"
readme = "README.md"
keywords = ["agents", "llm", "mcp", "tools", "ai"]
categories = ["api-bindings", "asynchronous"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["stdio", "http", "rustls-tls"]
stdio = ["rmcp/transport-child-process", "tokio/process"]
http = ["rmcp/transport-streamable-http-client-reqwest"]
rustls-tls = ["rmcp/reqwest"]
native-tls = ["rmcp/reqwest-native-tls"]

# The transports are native: on WebAssembly the crate is empty.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
genai-agents = { version = "0.3.0", path = "../genai-agents" }
rmcp = { version = "3.10.0", default-features = false, features = ["client"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.0", default-features = false, features = ["sync"] }
tracing = "0.1.41"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
genai-agents = { version = "0.3.0", path = "../genai-agents", features = ["testing"] }
rmcp = { version = "3.10.0", default-features = false, features = ["client", "server", "macros", "transport-io"] }
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread", "time"] }

# The test server as a child process: the test binary starts itself, without the test harness.
[[test]]
name = "stdio"
harness = false
