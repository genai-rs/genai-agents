[package]
name = "genai-agents-sqlite"
version = "0.1.3"
description = "SQLite sessions for genai-agents"
documentation = "https://docs.rs/genai-agents-sqlite"
readme = "README.md"
keywords = ["agents", "llm", "sqlite", "sessions", "ai"]
categories = ["database", "asynchronous"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
genai-agents = { version = "0.3.3", path = "../genai-agents" }
serde_json = "1.0.140"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tokio = { version = "1.45.0", default-features = false, features = ["rt"] }

[dev-dependencies]
genai-agents = { version = "0.3.3", path = "../genai-agents", features = ["testing"] }
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread"] }
